services:
  catalog-api:
    build:
      context: .
      dockerfile: src/Catalog/BrickShare.Catalog.Api/Dockerfile
    ports:
      # Host 5080 matches the port dotnet run uses (launchSettings.json), so the URL a
      # student already knows works unchanged against the container.
      - "5080:8080"
    environment:
      # Explicit, not load-bearing yet: no code branches on environment. Left unset, the
      # container defaults to Production, same as it will on App Service. Development is
      # set here because this file describes the local inner loop, and the two should not
      # silently drift apart as one gains behaviour the other doesn't.
      ASPNETCORE_ENVIRONMENT: Development

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: brickshare_catalog
      POSTGRES_USER: brickshare
      POSTGRES_PASSWORD: brickshare
    ports:
      # Published for the humans, not for the API. psql, Rider's database tool and `dotnet ef`
      # all run on the host and all need a route in.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickshare -d brickshare_catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - catalog-postgres:/var/lib/postgresql

volumes:
  catalog-postgres: